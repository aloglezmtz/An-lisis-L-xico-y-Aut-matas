<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hands-on 1 · AFD y Moore</title>
<style>
:root{--bg:#070b14;--p:#0e1524;--c:#22d3ee;--m:#f472b6;--g:#4ade80;--r:#fb7185;--t:#e2e8f0;--d:#64748b}
*{box-sizing:border-box}
body{margin:0;padding:14px;background:var(--bg);color:var(--t);font:14px/1.5 "JetBrains Mono","Fira Code",ui-monospace,monospace}
h1{font-size:20px;margin:0 0 2px;color:var(--c);text-shadow:0 0 12px #22d3ee66}
.sub{color:var(--d);margin-bottom:12px}
.card{background:var(--p);border:1px solid #1e293b;border-radius:8px;padding:12px;margin-bottom:12px}
.card h2{font-size:13px;margin:0 0 8px;color:var(--m);font-weight:600}
input,select,button{font:inherit;color:var(--t);background:#0b1220;border:1px solid #334155;border-radius:6px;padding:7px 10px}
input{width:min(340px,100%);border-color:var(--c)}
button{cursor:pointer}button:hover:not(:disabled){border-color:var(--c)}
button.x{border-color:#7f1d1d}button.go{background:var(--c);color:#04222a;border-color:var(--c);font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--m);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
#desc{min-height:44px;padding:8px 10px;border-left:3px solid var(--c);background:#0b1220}
#chars{font-size:22px;letter-spacing:3px;margin-bottom:8px;min-height:32px}
#chars span{padding:0 3px;color:var(--d);border-bottom:2px solid transparent}
#chars .k{color:var(--g)}#chars .c{color:#04222a;background:var(--c);border-radius:3px}#chars .e{background:var(--r);color:#fff;border-radius:3px}
.gw{overflow-x:auto}svg{min-width:920px;width:100%;display:block}
svg text{font-size:10px;fill:#94a3b8}svg .lb{fill:var(--c);font-size:11px}
.n circle{fill:#0b1220;stroke:#334155;stroke-width:1.5;transition:.35s}
.n.vis circle{stroke:var(--c)}.n.on circle{fill:var(--c);filter:drop-shadow(0 0 8px var(--c))}.n.err circle{fill:var(--r);stroke:var(--r)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:900px){.row{grid-template-columns:1fr}}
pre{margin:0;color:var(--g);white-space:pre-wrap}
#toks b{color:var(--m)}
#mo div{padding:4px 8px;border-left:3px solid #334155;margin-bottom:4px;color:var(--d)}
#mo div.cur{border-color:var(--c);color:var(--t);background:#0b1220}#mo span{color:var(--c)}
#dp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.reg{border:1px solid #334155;border-radius:6px;padding:6px;text-align:center;transition:.35s;background:#0b1220}
.reg i{display:block;font-style:normal;color:var(--d);font-size:11px}.reg b{font-size:18px}
.reg.s{border-color:var(--m);box-shadow:0 0 14px #f472b688}
.reg.d{border-color:var(--c);box-shadow:0 0 14px #22d3ee99;animation:pop .5s}
@keyframes pop{50%{transform:scale(1.08)}}
#flow{text-align:center;font-size:17px;color:var(--c);min-height:28px;margin-top:8px}
#quiz{border-color:var(--m)}.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:8px}
.opts button.bad{border-color:var(--r);color:var(--r);text-decoration:line-through}
#err{color:var(--r)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<h1>Hands-on 1 · Análisis léxico, AFD y Moore</h1>
<div class="sub">Motor en C++ compilado a WebAssembly <span id="st">(cargando…)</span></div>

<div class="card">
  <div class="bar"><input id="in" value="MOV AL, 6" aria-label="Instrucción" spellcheck="false"><button class="go" id="go">Analizar</button></div>
  <div class="bar" id="pre"></div>
</div>

<div class="card">
  <div class="bar">
    <button id="prev">◀ Anterior</button><button id="play">▶ Reproducir</button><button id="next">Siguiente ▶</button>
    <label>Velocidad <input id="spd" type="range" min="1" max="5" value="2" style="width:110px;padding:0"></label>
    <select id="mode" aria-label="Modo"><option value="auto">Modo automático</option><option value="quiz">Modo desafío</option></select>
    <span id="score"></span>
  </div>
  <div id="desc"></div>
</div>
<div class="card" id="quiz" style="display:none"></div>

<div class="card"><h2>AFD · lectura carácter por carácter</h2><div id="chars"></div><div class="gw"><svg id="svg" viewBox="0 0 1040 300"></svg></div></div>

<div class="row">
  <div>
    <div class="card"><h2>Tokens reconocidos</h2><div id="toks"></div></div>
    <div class="card"><h2>Objeto instrucción</h2><pre id="obj">—</pre></div>
    <div class="card"><h2>Máquina de Moore (estado ⟶ salida)</h2><div id="mo"></div></div>
  </div>
  <div class="card"><h2>Registros y memoria (valores de ejemplo: AL=5, BL=7, M[d]=(7d+3) mod 100)</h2>
    <div id="dp"></div><div id="flow"></div><div id="err"></div></div>
</div>

<script>
const $=id=>document.getElementById(id);
const ROWS=[["M1","M2","Q_MOV","MOV_SP","MOV_R","MOV_REG","MOV_COMA","MOV_NUM"],["A1","A2","Q_ADD","ADD_SP","ADD_A","ADD_AL","ADD_COMA","ADD_B","ADD_BL"],["S1","S2","Q_STO","STO_SP","STO_NUM"],["E1","E2","Q_END"]];
const P=['MOV AL, 6','MOV BL, 7','ADD AL, BL','STO 8','END','MOV AX, 6','MOV AL 6','ADD AL,','STO','END 8'];
let D,T=[],idx=-1,quiz=false,score=0,timer=null,qc={},S=[],built=false;
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
$('pre').innerHTML=P.map((p,i)=>`<button class="${i>4?'x':''}" data-p="${p}">${p}</button>`).join('');
$('pre').onclick=e=>{if(e.target.dataset.p){$('in').value=e.target.dataset.p;run()}};
$('go').onclick=run;$('in').onkeydown=e=>{if(e.key==='Enter')run()};
$('dp').innerHTML=['D','MEM','MAR','MBR','AL','BL','ACC','HALT'].map(r=>`<div class="reg" id="b_${r}"><i id="l_${r}">${r}</i><b id="v_${r}">0</b></div>`).join('');
$('l_D').textContent='d (operando)';

function graph(){
  const pos={Q0:[40,150]};ROWS.forEach((r,ri)=>r.forEach((n,k)=>pos[n]=[140+k*105,40+ri*75]));
  const E={};D.afd.aristas.forEach(([a,c,b])=>{(E[a+'|'+b]=E[a+'|'+b]||[]).push(c==='#'?'0-9':c===' '?'␣':c)});
  S=[...new Set(D.afd.aristas.flatMap(([a,,b])=>[a,b]))];
  let s='<defs><marker id="ar" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#475569"/></marker></defs>';
  for(const k in E){const [a,b]=k.split('|'),[x1,y1]=pos[a],[x2,y2]=pos[b],l=E[k].join(' | ');
    if(a===b)s+=`<text class="lb" x="${x1}" y="${y1-24}" text-anchor="middle">↻ ${l}</text>`;
    else{const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;
      s+=`<line x1="${x1+ux*18}" y1="${y1+uy*18}" x2="${x2-ux*20}" y2="${y2-uy*20}" stroke="#475569" marker-end="url(#ar)"/><text class="lb" x="${(x1+x2)/2}" y="${(y1+y2)/2-6}" text-anchor="middle">${l}</text>`}}
  for(const n in pos){const [x,y]=pos[n];
    s+=`<g class="n" id="n_${n}">${D.afd.acepta.includes(n)?`<circle cx="${x}" cy="${y}" r="21"/>`:''}<circle cx="${x}" cy="${y}" r="16"/><text x="${x}" y="${y+34}" text-anchor="middle">${n}</text></g>`}
  $('svg').innerHTML=s;
}
function run(){
  if(!window.an)return;stop();D=JSON.parse(an($('in').value));if(!built){graph();built=true}
  T=D.pasos.map((_,i)=>({t:'a',i}));
  if(D.ok){T.push({t:'o'});D.moore.forEach((_,j)=>T.push({t:'m',j}))}
  idx=-1;score=0;qc={};render();
}
function machine(u){
  const R={AL:5,BL:7,ACC:0,MAR:0,MBR:0,HALT:0},M={},rd=a=>M[a]??((a*7+3)%100);let src=[],dst=null;
  for(let j=0;j<=u;j++){const s=D.moore[j].salida;if(!s)continue;const [l,r]=s.split(' ← ');let v;
    if(/^\d+$/.test(r)){v=+r;src=l==='HALT'?[]:['D']}
    else if(r==='M[MAR]'){v=rd(R.MAR);src=['MEM']}
    else if(r==='AL + BL'){v=R.AL+R.BL;src=['AL','BL']}
    else{v=R[r];src=[r]}
    if(l==='M[MAR]'){M[R.MAR]=v;dst='MEM'}else{R[l]=v;dst=l}}
  const dd=D.objeto?D.objeto.direccion??0:0;
  return{R,src,dst,dd,mem:rd(dd)};
}
function desc(it){
  if(!it)return 'Pulsa «Siguiente» o ▶ para empezar. El AFD lee un carácter por paso.';
  if(it.t==='a'){const p=D.pasos[it.i];
    if(p.a==='ERROR')return '✗ Instrucción inválida: '+D.error+'.';
    if(p.a==='ACEPTA')return `✓ Fin de cadena: ${p.de} es un estado de aceptación.`;
    return `δ(${p.de}, '${p.c===' '?'␣':p.c}') = ${p.a}`}
  if(it.t==='o')return 'Con los tokens validados se construye el objeto instrucción.';
  const m=D.moore[it.j];return `Moore · estado «${m.estado}» emite ${m.salida||'nada'}; siguiente: ${m.sig}`;
}
function qz(it){
  if(!it)return null;
  if(it.t==='a'){const p=D.pasos[it.i];if(p.a==='ERROR'||p.a==='ACEPTA')return null;
    return{q:`Estado ${p.de}, carácter '${p.c===' '?'␣':p.c}': ¿cuál es el siguiente estado?`,ans:p.a,pool:S}}
  if(it.t==='m'){const m=D.moore[it.j];if(!m.salida)return null;
    const d=D.objeto.direccion;
    return{q:`Moore, estado «${m.estado}»: ¿qué microoperación emite?`,ans:m.salida,
      pool:[`MAR ← ${d}`,'MBR ← M[MAR]','AL ← MBR','BL ← MBR','ACC ← AL + BL','MBR ← ACC','M[MAR] ← MBR','HALT ← 1']}}
  return null;
}
function render(){
  const na=D.pasos.length,done=Math.min(idx+1,na),p=idx<0?null:D.pasos[Math.min(idx,na-1)];
  let cur='Q0',err=false;
  if(p){if(p.a==='ERROR'){cur=p.de;err=true}else if(p.a==='ACEPTA')cur=p.de;else cur=p.a}
  document.querySelectorAll('.n').forEach(e=>e.setAttribute('class','n'));
  for(let i=0;i<done;i++)[D.pasos[i].de,D.pasos[i].a].forEach(s=>$('n_'+s)?.classList.add('vis'));
  $('n_'+cur)?.classList.add(err?'err':'on');
  $('chars').innerHTML=[...D.entrada].map((c,i)=>`<span class="${i<done-1?'k':i===done-1?(p.a==='ERROR'?'e':'c'):''}">${c===' '?'␣':c}</span>`).join('');
  $('toks').innerHTML=D.tokens.filter(t=>t.paso<=done).map(t=>`<div><b>${t.tipo}</b>("${t.lex}")</div>`).join('')||'—';
  $('obj').textContent=D.ok&&idx>=na?`{\n  operacion: "${D.objeto.operacion}",\n  registros: [${D.objeto.registros.map(r=>`"${r}"`).join(', ')}],\n  direccion: ${D.objeto.direccion}\n}`:'—';
  const cj=D.ok?idx-na-1:-1;
  $('mo').innerHTML=D.moore.map((m,j)=>j<=cj?`<div class="${j===cj?'cur':''}"><b>${m.estado}</b> ⟶ <span>${m.salida||'∅ terminar'}</span></div>`:'').join('');
  const st=machine(cj);
  ['AL','BL','ACC','MAR','MBR','HALT'].forEach(r=>$('v_'+r).textContent=st.R[r]);
  $('l_MEM').textContent='M['+st.dd+']';$('v_MEM').textContent=st.mem;$('v_D').textContent=D.objeto?.direccion??'—';
  document.querySelectorAll('.reg').forEach(e=>e.classList.remove('s','d'));
  st.src.forEach(x=>$('b_'+x)?.classList.add('s'));if(st.dst)$('b_'+st.dst)?.classList.add('d');
  $('flow').textContent=cj>=0?D.moore[cj].salida:'';
  $('err').textContent=err||(idx>=0&&D.pasos[Math.min(idx,na-1)].a==='ERROR')?'Sin objeto ni microoperaciones: la instrucción fue rechazada.':'';
  $('desc').textContent=desc(idx<0?null:T[idx]);
  $('score').textContent=quiz?`Puntos: ${score}`:'';
  $('quiz').style.display=quiz?'block':'none';
  if(quiz){const q=qz(T[idx+1]);
    if(q){qc[idx]=qc[idx]||shuf([q.ans,...shuf(q.pool.filter(x=>x!==q.ans)).slice(0,3)]);
      $('quiz').innerHTML=`<b>${q.q}</b><div class="opts">${qc[idx].map(o=>`<button>${o}</button>`).join('')}</div>`}
    else $('quiz').innerHTML=idx>=T.length-1?`Fin del recorrido. Puntuación: ${score}`:'Este paso es automático: pulsa «Siguiente».'}
  $('prev').disabled=idx<0;
}
$('quiz').onclick=e=>{const b=e.target.closest('button');if(!b)return;const q=qz(T[idx+1]);if(!q)return;
  if(b.textContent===q.ans){score++;idx++;render()}else{score=Math.max(0,score-1);b.classList.add('bad');b.disabled=true;$('score').textContent=`Puntos: ${score}`}};
const stuck=()=>quiz&&qz(T[idx+1]);
function stop(){clearInterval(timer);timer=null;$('play').textContent='▶ Reproducir'}
$('next').onclick=()=>{if(idx<T.length-1&&!stuck()){idx++;render()}};
$('prev').onclick=()=>{if(idx>=0){idx--;render()}};
$('play').onclick=()=>{if(timer)return stop();if(idx>=T.length-1)idx=-1;
  timer=setInterval(()=>{if(idx>=T.length-1||stuck())return stop();idx++;render()},2400/$('spd').value);$('play').textContent='⏸ Pausar'};
$('spd').oninput=()=>{if(timer){stop();$('play').click()}};
$('mode').onchange=()=>{quiz=$('mode').value==='quiz';stop();render()};

// --- Conexión con C++/WebAssembly (Module se define ANTES de cargar hands_on1.js) ---
function boot(){
  try{
    const M=Module;
    if(typeof M._h1_procesar!=='function')throw new Error('el .wasm no trae h1_procesar: usa el .cpp actualizado y recompila');
    const enc=new TextEncoder(),dec=new TextDecoder();
    window.an=s=>{
      M._h1_limpiar();
      for(const b of enc.encode(s))M._h1_byte(b);
      const n=M._h1_procesar(),u=new Uint8Array(n);
      for(let i=0;i<n;i++)u[i]=M._h1_leer(i);
      return dec.decode(u);
    };
    $('st').textContent='· listo';run();
  }catch(e){$('st').textContent='· ERROR: '+e.message;console.error(e)}
}
var Module={onRuntimeInitialized:boot,onAbort:w=>{$('st').textContent='· WASM abortó: '+w},print:console.log,printErr:console.error};
</script>
<script src="hands_on1.js" onerror="$('st').textContent='· no se pudo cargar hands_on1.js (compílalo y abre la página desde http://localhost:8000)'"></script>
</body></html>
